services:
  exporter:
    build: .
    restart: unless-stopped
    environment:
      ROUTER_HOST: ${ROUTER_HOST:-192.168.31.1}
      ROUTER_PASSWORD: ${ROUTER_PASSWORD:?set ROUTER_PASSWORD in .env}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-15}

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${RETENTION:-90d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on: [exporter]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    # Grafana turns numeric chat ids into numbers when expanding variables, and the
    # contact point requires a string. That is why the placeholders are replaced
    # here, before Grafana reads the provisioning files.
    entrypoint:
      - sh
      - -c
      - |
        # Recreate the copy on every start: if /tmp/provisioning already exists
        # (restarted container), cp -r would create a subfolder and Grafana would
        # keep reading the old files.
        rm -rf /tmp/provisioning
        cp -r /provisioning-src /tmp/provisioning
        [ -f /tmp/provisioning/alerting/telegram.yml ] && sed -i "s|__TELEGRAM_BOT_TOKEN__|$$TELEGRAM_BOT_TOKEN|; s|__TELEGRAM_CHAT_ID__|$$TELEGRAM_CHAT_ID|" /tmp/provisioning/alerting/telegram.yml
        exec /run.sh
    environment:
      GF_PATHS_PROVISIONING: /tmp/provisioning
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/provisioning-src:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  prometheus-data:
  grafana-data:
