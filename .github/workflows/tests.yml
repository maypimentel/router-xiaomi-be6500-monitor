name: Tests

on:
  pull_request:
    # opened = PR opened; synchronize = new commits pushed to the PR; reopened = PR reopened
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# On PRs a new commit cancels the previous run; on main every push runs to completion.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # same version as the Dockerfile image
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
