name: Testes

on:
  pull_request:
    # opened = abertura; synchronize = novos commits no PR; reopened = PR reaberto
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Em PR, um novo commit cancela a execução anterior; na main cada push roda até o fim.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # mesma versão da imagem do Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest -v
