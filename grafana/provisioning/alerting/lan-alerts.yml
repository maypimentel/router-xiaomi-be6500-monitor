{
 "apiVersion": 1,
 "groups": [
  {
   "orgId": 1,
   "name": "lan",
   "folder": "Xiaomi BE6500 LAN",
   "interval": "30s",
   "rules": [
    {
     "uid": "new-client",
     "title": "New device on the network",
     "condition": "C",
     "for": "0s",
     "noDataState": "OK",
     "execErrState": "Error",
     "labels": {
      "severity": "warning"
     },
     "annotations": {
      "summary": "New device: {{ $labels.name }} ({{ $labels.ip }}, {{ $labels.mac }})"
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "prometheus",
       "model": {
        "expr": "(router_client_info unless on(mac) max_over_time(router_client_info[7d] offset 30m)) and on() (count(max_over_time(router_client_info[7d] offset 30m)) > 0)",
        "instant": true,
        "refId": "A"
       }
      },
      {
       "refId": "B",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "__expr__",
       "model": {
        "type": "reduce",
        "expression": "A",
        "reducer": "last",
        "refId": "B"
       }
      },
      {
       "refId": "C",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "__expr__",
       "model": {
        "type": "threshold",
        "expression": "B",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            0
           ]
          }
         }
        ],
        "refId": "C"
       }
      }
     ]
    }
   ]
  }
 ]
}
