{
 "apiVersion": 1,
 "groups": [
  {
   "orgId": 1,
   "name": "wan",
   "folder": "Xiaomi BE6500",
   "interval": "30s",
   "rules": [
    {
     "uid": "wan1-down",
     "title": "WAN1 down",
     "condition": "C",
     "for": "1m",
     "noDataState": "Alerting",
     "execErrState": "Error",
     "labels": {
      "severity": "critical"
     },
     "annotations": {
      "summary": "WAN1 has been disconnected (status != 2) for more than 1 minute"
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "prometheus",
       "model": {
        "expr": "(router_wan_up{wan=\"WAN1\"} == bool 0)",
        "instant": true,
        "refId": "A"
       }
      },
      {
       "refId": "B",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "__expr__",
       "model": {
        "type": "reduce",
        "expression": "A",
        "reducer": "last",
        "refId": "B"
       }
      },
      {
       "refId": "C",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "__expr__",
       "model": {
        "type": "threshold",
        "expression": "B",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            0
           ]
          }
         }
        ],
        "refId": "C"
       }
      }
     ]
    },
    {
     "uid": "wan2-down",
     "title": "WAN2 down (multiwan enabled)",
     "condition": "C",
     "for": "1m",
     "noDataState": "Alerting",
     "execErrState": "Error",
     "labels": {
      "severity": "critical"
     },
     "annotations": {
      "summary": "WAN2 is disconnected while multiwan is enabled"
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "prometheus",
       "model": {
        "expr": "(router_wan_up{wan=\"WAN2\"} == bool 0) * on() group_left() router_multiwan_enabled",
        "instant": true,
        "refId": "A"
       }
      },
      {
       "refId": "B",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "__expr__",
       "model": {
        "type": "reduce",
        "expression": "A",
        "reducer": "last",
        "refId": "B"
       }
      },
      {
       "refId": "C",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "__expr__",
       "model": {
        "type": "threshold",
        "expression": "B",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            0
           ]
          }
         }
        ],
        "refId": "C"
       }
      }
     ]
    },
    {
     "uid": "router-unreachable",
     "title": "Router not responding",
     "condition": "C",
     "for": "2m",
     "noDataState": "Alerting",
     "execErrState": "Error",
     "labels": {
      "severity": "critical"
     },
     "annotations": {
      "summary": "The exporter cannot collect data from the router"
     },
     "data": [
      {
       "refId": "A",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "prometheus",
       "model": {
        "expr": "(1 - router_scrape_success)",
        "instant": true,
        "refId": "A"
       }
      },
      {
       "refId": "B",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "__expr__",
       "model": {
        "type": "reduce",
        "expression": "A",
        "reducer": "last",
        "refId": "B"
       }
      },
      {
       "refId": "C",
       "relativeTimeRange": {
        "from": 300,
        "to": 0
       },
       "datasourceUid": "__expr__",
       "model": {
        "type": "threshold",
        "expression": "B",
        "conditions": [
         {
          "evaluator": {
           "type": "gt",
           "params": [
            0
           ]
          }
         }
        ],
        "refId": "C"
       }
      }
     ]
    }
   ]
  }
 ]
}